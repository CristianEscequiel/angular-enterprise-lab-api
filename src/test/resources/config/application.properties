# Spec 06, tarea 1: valores de prueba para todos los tests que arrancan el contexto.
# Se usan los nombres de propiedad (no las variables JWT_SECRET / DB_PASSWORD) para no
# confundirlos con las variables reales; los tests de arranque (StartupConfigIT) saltan este
# archivo con --spring.config.location=classpath:/application.yml.
app.jwt.secret=test-only-secret-for-integration-tests-32-bytes-min
spring.datasource.password=test-only-password
# Límites del login holgados: los contextos se cachean entre clases y varios tests fallan
# logins a propósito; los tests del límite fijan sus propios valores.
app.security.login-rate-limit.max-attempts-per-user=1000
app.security.login-rate-limit.max-attempts-per-ip=1000
