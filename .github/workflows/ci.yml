name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # El bit ejecutable se pierde al commitear desde Windows.
      - run: chmod +x ./gradlew

      # `build` corre también las IT (Testcontainers usa el Docker del runner).
      - run: ./gradlew build

  # Publica la imagen en GHCR. Solo en push a master (no en PRs) y solo si
  # `build` (tests incluidos) terminó en verde.
  docker:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # necesario para subir a ghcr.io con GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige nombres en minúsculas; esta acción lo resuelve sola
      # (el owner "CristianEscequiel" tiene mayúsculas).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Despliega en el servidor: le pide al script restringido del VPS que use la imagen
  # recién publicada (tag sha-xxxxxxx, el mismo que generó metadata-action).
  deploy:
    needs: docker
    # DEPLOY_ENABLED (variable del repo) permite apagar el deploy hasta que el servidor esté listo.
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Un deploy a la vez por servicio; si llega otro push, espera (no se cancela a mitad).
    concurrency:
      group: deploy-lab-api
      cancel-in-progress: false
    steps:
      - name: Desplegar en el servidor
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Huella del servidor fijada de antemano: sin StrictHostKeyChecking=no.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # El servidor ignora cualquier comando que no sea "<servicio> <tag>".
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "root@$DEPLOY_HOST" "api sha-${GITHUB_SHA::7}"
