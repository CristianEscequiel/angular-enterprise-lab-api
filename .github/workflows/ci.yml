name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # El bit ejecutable se pierde al commitear desde Windows.
      - run: chmod +x ./gradlew

      # `build` corre también las IT (Testcontainers usa el Docker del runner).
      - run: ./gradlew build
